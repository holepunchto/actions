name: Attest
description: Attest the build provenance of files, which requires the id-token and attestations write permissions

inputs:
  subject-path:
    description: The files to attest, separated by commas or newlines and expanded as globs
    required: true

runs:
  using: composite
  steps:
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
