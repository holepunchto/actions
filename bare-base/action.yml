name: Bare base
description: Configure a Bare project

inputs:
  allow-git:
    description: Allow git dependencies
    default: none
  force-install:
    description: Force install npm packages
    default: false
  registry-url:
    description: npm registry URL to configure for auth
    default: https://registry.npmjs.org
  scope:
    description: Optional scope for scoped registries (e.g. @myorg)
  node-auth-token:
    description: npm auth token
  source:
    description: Compile Bare from source instead of installing the prebuilt runtime
    default: false
  ref:
    description: The `holepunchto/bare` git ref (branch, tag, or SHA) to compile when building from source
  flags:
    description: Additional flags to pass to the build system when compiling from source
  path:
    description: The directory to check out and build the Bare source in when compiling from source
    default: .bare

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/node-base@v1
      with:
        allow-git: ${{ inputs.allow-git }}
        force-install: ${{ inputs.force-install }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        node-auth-token: ${{ inputs.node-auth-token }}
    - uses: holepunchto/actions/setup-bare@v1
      with:
        source: ${{ inputs.source }}
        ref: ${{ inputs.ref }}
        flags: ${{ inputs.flags }}
        path: ${{ inputs.path }}
