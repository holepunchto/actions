name: Bare base
description: Check out the repository, install Node.js and npm dependencies, and install Bare

inputs:
  node-version:
    description: The Node.js version to install, such as 24 or lts/*
    default: lts/*
  allow-git:
    description: Which git dependencies to allow, either none, root for those of the root package only, or all
    default: none
  clean-install:
    description: Install dependencies with npm clean-install instead of npm install
    default: false
  force-install:
    description: Pass --force to npm when installing dependencies
    default: false
  registry-url:
    description: The npm registry URL to configure authentication for
    default: https://registry.npmjs.org
  scope:
    description: The package scope to use the registry for, such as @myorg
  node-auth-token:
    description: The token to authenticate with the npm registry. Defaults to the NODE_AUTH_TOKEN environment variable.
  source:
    description: Compile Bare from source instead of installing the prebuilt runtime
    default: false
  ref:
    description: The `holepunchto/bare` git ref (branch, tag, or SHA) to compile when building from source
  flags:
    description: Additional flags to pass to the build system when compiling from source
  path:
    description: The directory to check out and build the Bare source in when compiling from source
    default: .bare

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/node-base@v1
      with:
        version: ${{ inputs.node-version }}
        allow-git: ${{ inputs.allow-git }}
        clean-install: ${{ inputs.clean-install }}
        force-install: ${{ inputs.force-install }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        node-auth-token: ${{ inputs.node-auth-token }}
    - uses: holepunchto/actions/setup-bare@v1
      with:
        source: ${{ inputs.source }}
        ref: ${{ inputs.ref }}
        flags: ${{ inputs.flags }}
        path: ${{ inputs.path }}
