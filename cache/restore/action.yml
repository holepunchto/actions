name: Restore cache
description: Restore artifacts like dependencies and build outputs from the cache

inputs:
  path:
    description: A list of files, directories, and wildcard patterns to restore
    required: true
  key:
    description: An explicit key for restoring the cache
    required: true
  restore-keys:
    description: Ordered multiline prefix-matched keys used to restore a stale cache on a primary key miss
  enableCrossOsArchive:
    description: Allow Windows runners to restore caches that were saved on other platforms
    default: 'false'
  fail-on-cache-miss:
    description: Fail the workflow if a cache entry is not found
    default: 'false'
  lookup-only:
    description: Check if a cache entry exists without downloading it
    default: 'false'

outputs:
  cache-hit:
    description: Whether an exact match was found for the primary key
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: The resolved cache key for which a cache match was attempted
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: Key of the cache that was restored, either the primary key or a match of one of the restore keys
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        lookup-only: ${{ inputs.lookup-only }}
