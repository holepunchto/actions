name: Save cache
description: Save artifacts like dependencies and build outputs to the cache

inputs:
  path:
    description: A list of files, directories, and wildcard patterns to cache
    required: true
  key:
    description: An explicit key for saving the cache
    required: true
  upload-chunk-size:
    description: Chunk size used to split up large files during upload, in bytes
  enableCrossOsArchive:
    description: Allow Windows runners to save caches that can be restored on other platforms
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
