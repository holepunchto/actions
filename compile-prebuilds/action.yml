name: Compile prebuilds
description: Compile and optionally upload native prebuilds

inputs:
  platform:
    description: The platform to compile for
  arch:
    description: The architecture to compile for
  flags:
    description: Additional flags to apply to the build system
  tags:
    description: Additional tags to apply to uploaded prebuilds
  prefix:
    description: The prebuild prefix
    default: prebuilds
  path:
    description: The directory containing the source tree to compile
    default: .
  build:
    description: The build tree, relative to the source tree, such as to compile the same source tree more than once
    default: build
  upload:
    description: Upload the compiled prebuilds
    default: false
  archive:
    description: Upload the prebuilds as a tarball, which preserves symlinks such as those of a macOS framework
    default: false
  wasi:
    description: Install the WASI sysroot for targeting WASI
    default: false
  musl:
    description: Install the musl sysroot for targeting musl
    default: false
  picolibc:
    description: Install the picolibc sysroot for targeting FreeRTOS
    default: false

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/setup-bare-make@v1
      with:
        wasi: ${{ inputs.wasi }}
        musl: ${{ inputs.musl }}
        picolibc: ${{ inputs.picolibc }}
    - run: bare-make generate --build $BUILD ${PLATFORM:+--platform $PLATFORM} ${ARCH:+--arch $ARCH} $FLAGS
      env:
        BUILD: ${{ inputs.build }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        FLAGS: ${{ inputs.flags }}
      working-directory: ${{ inputs.path }}
      shell: bash
    - run: bare-make build --build $BUILD
      env:
        BUILD: ${{ inputs.build }}
      working-directory: ${{ inputs.path }}
      shell: bash
    - run: bare-make install --build $BUILD --prefix $PREFIX
      env:
        BUILD: ${{ inputs.build }}
        PREFIX: ${{ inputs.prefix }}
      working-directory: ${{ inputs.path }}
      shell: bash
    - uses: holepunchto/actions/upload-prebuilds@v1
      if: ${{ inputs.upload == 'true' }}
      with:
        platform: ${{ inputs.platform }}
        arch: ${{ inputs.arch }}
        tags: ${{ inputs.tags }}
        prefix: ${{ format('{0}/{1}', inputs.path, inputs.prefix) }}
        archive: ${{ inputs.archive }}
