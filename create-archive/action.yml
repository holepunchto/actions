name: Create archive
description: Archive files and directories as a single archive for publishing, such as for a release asset

inputs:
  paths:
    description: The files and directories to archive, relative to the directory, separated by spaces and expanded as globs
    required: true
  directory:
    description: The directory that the paths are relative to and that the archive is made from, relative to the working directory. Defaults to the working directory.
    required: false
  name:
    description: The path of the archive without its extension, relative to the working directory. Defaults to the path to archive if only one is given.
    required: false
  format:
    description: The format of the archive, either zip, tar.gz, or tar.xz
    default: zip
  attest:
    description: Attest the build provenance of the archive, which requires the id-token and attestations write permissions
    default: false

outputs:
  path:
    description: The path of the archive
    value: ${{ steps.archive.outputs.path }}

runs:
  using: composite
  steps:
    - id: archive
      run: |
        root=$PWD

        cd "${DIRECTORY:-.}"

        paths=($PATHS)

        if [ -n "$NAME" ]; then
          name=$NAME
        elif [ ${#paths[@]} -eq 1 ]; then
          name=${DIRECTORY:+$DIRECTORY/}${paths[0]}
        else
          echo "::error::A name is required to archive more than one path"
          exit 1
        fi

        archive="$root/$name.$FORMAT"

        mkdir -p "$(dirname "$archive")"

        case $FORMAT in
          zip) zip -qry "$archive" "${paths[@]}" ;;
          tar.gz) tar -czf "$archive" "${paths[@]}" ;;
          tar.xz) tar -cJf "$archive" "${paths[@]}" ;;
          *)
            echo "::error::Unknown archive format $FORMAT"
            exit 1
            ;;
        esac

        echo "path=$name.$FORMAT" >> $GITHUB_OUTPUT
      env:
        PATHS: ${{ inputs.paths }}
        DIRECTORY: ${{ inputs.directory }}
        NAME: ${{ inputs.name }}
        FORMAT: ${{ inputs.format }}
      shell: bash
    - uses: holepunchto/actions/attest@v1
      if: ${{ inputs.attest == 'true' }}
      with:
        subject-path: ${{ steps.archive.outputs.path }}
