name: Create artifact bundle
description: Archive a SwiftPM artifact bundle for publishing

inputs:
  path:
    description: The artifact bundle directory, relative to the working directory
    required: true

outputs:
  path:
    description: The path of the archived artifact bundle
    value: ${{ steps.archive.outputs.path }}

runs:
  using: composite
  steps:
    - id: archive
      uses: holepunchto/actions/create-archive@v1
      with:
        path: ${{ inputs.path }}
