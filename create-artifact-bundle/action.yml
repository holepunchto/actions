name: Create artifact bundle
description: Archive a SwiftPM artifact bundle for publishing

inputs:
  path:
    description: The artifact bundle directory, relative to the working directory
    required: true
  attest:
    description: Attest the build provenance of the archived artifact bundle, which requires the id-token and attestations write permissions
    default: false

outputs:
  path:
    description: The path of the archived artifact bundle
    value: ${{ steps.archive.outputs.path }}

runs:
  using: composite
  steps:
    - id: archive
      uses: holepunchto/actions/create-archive@v1
      with:
        path: ${{ inputs.path }}
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      if: ${{ inputs.attest == 'true' }}
      with:
        subject-path: ${{ steps.archive.outputs.path }}
