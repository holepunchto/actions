name: Create XCFramework
description: Merge per-target framework prebuilds into an XCFramework, optionally archived for publishing

inputs:
  name:
    description: The name of the framework, such that each target directory of the prefix contains <name>.framework
    required: true
  prefix:
    description: The prebuild prefix, with a directory per target such as darwin-arm64 or ios-x64-simulator
    default: prebuilds
  path:
    description: The XCFramework directory to create, relative to the working directory. Defaults to <name>.xcframework.
    required: false
  archive:
    description: Archive the XCFramework as <path>.zip, such as for a SwiftPM binary target
    default: false
  sign:
    description: Code sign the XCFramework with the given identity, such that Xcode verifies its signer
    default: false
  identity:
    description: The code signing identity in the keychain, required if signing
    required: false
  attest:
    description: Attest the build provenance of the XCFramework archive, which requires archiving and the id-token and attestations write permissions
    default: false

outputs:
  path:
    description: The path of the XCFramework, or of its archive if archived
    value: ${{ format(inputs.archive == 'true' && '{0}.zip' || '{0}', inputs.path || format('{0}.xcframework', inputs.name)) }}

runs:
  using: composite
  steps:
    - run: |
        args=()

        for group in $(ls "$PREFIX" | sed -E 's/-(arm64|x64)//' | sort -u); do
          framework="$RUNNER_TEMP/xcframework/$group/$NAME.framework"
          binaries=()

          for target in $(ls "$PREFIX"); do
            if [ "$(echo "$target" | sed -E 's/-(arm64|x64)//')" = "$group" ]; then
              if [ ! -d "$framework" ]; then
                mkdir -p "$(dirname "$framework")"
                cp -R "$PREFIX/$target/$NAME.framework" "$framework"
              fi

              binaries+=("$PREFIX/$target/$NAME.framework/$NAME")
            fi
          done

          if [ -d "$framework/Versions" ]; then
            binary="$framework/Versions/Current/$NAME"
          else
            binary="$framework/$NAME"
          fi

          lipo -create -output "$binary" "${binaries[@]}"

          args+=(-framework "$framework")
        done

        xcodebuild -create-xcframework -output "$OUTPUT" "${args[@]}"
      env:
        NAME: ${{ inputs.name }}
        PREFIX: ${{ inputs.prefix }}
        OUTPUT: ${{ inputs.path || format('{0}.xcframework', inputs.name) }}
      shell: bash
    - run: codesign --timestamp --sign "$IDENTITY" "$OUTPUT"
      if: ${{ inputs.sign == 'true' }}
      env:
        IDENTITY: ${{ inputs.identity }}
        OUTPUT: ${{ inputs.path || format('{0}.xcframework', inputs.name) }}
      shell: bash
    - uses: holepunchto/actions/create-archive@v1
      if: ${{ inputs.archive == 'true' }}
      with:
        path: ${{ inputs.path || format('{0}.xcframework', inputs.name) }}
        attest: ${{ inputs.attest }}
