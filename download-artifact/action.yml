name: Download artifact
description: Download workflow artifacts

inputs:
  name:
    description: The name of the artifact to download. Defaults to all of them.
    required: false
  pattern:
    description: The names of the artifacts to download, as a glob. Ignored if a name is given.
    required: false
  path:
    description: The directory to download to, relative to the working directory
    default: .
  merge-multiple:
    description: Download every artifact to the same directory instead of one directory for each
    default: false

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
