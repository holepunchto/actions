name: Download wheels
description: Download the Python wheels uploaded for every platform

inputs:
  path:
    description: The directory to download the wheels to
    default: dist

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ inputs.path }}
        pattern: wheels-*
        merge-multiple: true
