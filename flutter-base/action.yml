name: Flutter base
description: Configure a Flutter project

inputs:
  version:
    description: The Flutter SDK to install, or none for the latest
    required: false

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/checkout@v1
    - uses: holepunchto/actions/setup-dart@v1
    - uses: holepunchto/actions/setup-flutter@v1
      with:
        version: ${{ inputs.version }}
    - run: flutter pub get
      shell: bash
