name: Install npm dependencies
description: Install npm dependencies through Socket Firewall when available

inputs:
  allow-git:
    description: Allow git dependencies
    default: none
  clean-install:
    description: Use npm ci
    default: false
  force-install:
    description: Force install npm packages
    default: false
  node-auth-token:
    description: npm auth token

runs:
  using: composite
  steps:
    - run: |
        sfw=$(command -v sfw || true)
        npm_cmd="npm"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          npm_cmd="npm.cmd"
        fi
        $sfw $npm_cmd ${{ case(inputs.clean-install == 'true', 'ci', 'install') }} --ignore-scripts --foreground-scripts --allow-git=${{ case(inputs.allow-git == 'root', 'root', inputs.allow-git == 'all', 'all', 'none') }} ${{ case(inputs.force-install == 'true', '--force', '') }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN }}
      shell: bash
