name: Install npm dependencies
description: Install npm dependencies through Socket Firewall when available

inputs:
  allow-git:
    description: Which git dependencies to allow, either none, root for those of the root package only, or all
    default: none
  clean-install:
    description: Install dependencies with npm clean-install instead of npm install
    default: false
  force-install:
    description: Pass --force to npm when installing dependencies
    default: false
  node-auth-token:
    description: The token to authenticate with the npm registry. Defaults to the NODE_AUTH_TOKEN environment variable.

runs:
  using: composite
  steps:
    - run: |
        sfw=$(command -v sfw || true)
        npm_cmd="npm"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          npm_cmd="npm.cmd"
        fi
        $sfw $npm_cmd ${{ case(inputs.clean-install == 'true', 'ci', 'install') }} --ignore-scripts --foreground-scripts --allow-git=${{ case(inputs.allow-git == 'root', 'root', inputs.allow-git == 'all', 'all', 'none') }} ${{ case(inputs.force-install == 'true', '--force', '') }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN }}
      shell: bash
