name: 'Make Pear Apps'
description: 'Action for making Pear apps'

inputs:
  ci:
    description: 'Use npm ci'
    required: false
    default: true
  allow-git:
    description: 'Allow git dependencies'
    required: false
    default: none
  force-install:
    description: 'Force install npm packages'
    required: false
    default: false
  registry-url:
    description: 'npm registry URL to configure for auth'
    required: false
    default: 'https://registry.npmjs.org'
  scope:
    description: 'Optional scope for scoped registries (e.g. @myorg)'
    required: false
  node-auth-token:
    description: 'npm auth token'
    required: false
  post-install:
    description: 'npm script to run after installing dependencies'
    required: false
  channel:
    description: 'Channel name'
    required: true
  upgrade_key:
    description: 'Upgrade key'
    required: false
    default: ''
  host:
    description: 'npm run make $HOST environment variable'
    required: false
    default: ''
  standalone:
    description: 'Standalone executable to upload'
    required: false
    default: ''
  standalone_artifact_name:
    description: 'name for the uploaded standalone artifact'
    required: false
    default: ''
  macos_dmg:
    description: 'macOS DMG to upload'
    required: false
    default: ''
  macos_app:
    description: 'macOS app bundle ZIP archive to upload'
    required: false
    default: ''
  macos_dmg_artifact_name:
    description: 'name for the uploaded macos dmg artifact'
    required: false
    default: ''
  macos_certificate_base64:
    description: 'Base64-encoded Apple distribution certificate (P12 format)'
    required: false
    default: ''
  macos_p12_password:
    description: 'Password for the P12 certificate'
    required: false
    default: ''
  macos_codesign_identity:
    description: 'Code signing identity used for macOS builds'
    required: false
    default: ''
  macos_notarization_method:
    description: 'Notarization method to use: appstore_connect or apple_id_password'
    required: false
    default: ''
  macos_apple_id:
    description: 'Apple ID email for notarization'
    required: false
    default: ''
  macos_apple_password:
    description: 'Apple app-specific password'
    required: false
    default: ''
  macos_apple_team_id:
    description: 'Apple Developer Team ID'
    required: false
    default: ''
  macos_api_key_base64:
    description: 'Base64-encoded App Store Connect API key (like AuthKey_ABCD123456.p8)'
    required: false
    default: ''
  macos_api_key_id:
    description: '10-character alphanumeric ID string of the App Store Connect (like ABCD123456)'
    required: false
    default: ''
  macos_api_issuer:
    description: 'UUID that identifies the API key issuer'
    required: false
    default: ''
  windows_msix:
    description: 'Windows MSIX to upload'
    required: false
    default: ''
  windows_msix_artifact_name:
    description: 'name for the uploaded windows msix artifact'
    required: false
    default: ''
  windows_zip:
    description: 'Windows ZIP to upload'
    required: false
    default: ''
  windows_zip_artifact_name:
    description: 'name for the uploaded windows zip artifact'
    required: false
    default: ''
  windows_signing_method:
    description: 'Signing method to use: cert_sha1 or cert_pfx'
    required: false
    default: ''
  windows_cert_sha1:
    description: 'SHA1 thumbprint of the Windows cert'
    required: false
    default: ''
  windows_cert_pfx_base64:
    description: 'Base64-encoded Windows cert pfx file'
    required: false
    default: ''
  windows_cert_password:
    description: 'Password for the Windows certificate'
    required: false
    default: ''
  linux_appimage:
    description: 'Linux AppImage to upload'
    required: false
    default: ''
  linux_appimage_artifact_name:
    description: 'name for the uploaded linux appimage artifact'
    required: false
    default: ''
  linux_snap:
    description: 'Linux Snap to upload'
    required: false
    default: ''
  linux_snap_artifact_name:
    description: 'name for the uploaded linux snap artifact'
    required: false
    default: ''
  linux_flatpak:
    description: 'Linux Flatpak to upload'
    required: false
    default: ''
  linux_flatpak_artifact_name:
    description: 'name for the uploaded linux flatpak artifact'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: RaisinTen/actions/node-base@use-node-base-in-make-pear-app
      if: ${{ runner.os != 'Windows' }}
      with:
        ci: ${{ inputs.ci }}
        allow-git: ${{ inputs.allow-git }}
        force-install: ${{ inputs.force-install }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        node-auth-token: ${{ inputs.node-auth-token }}
        post-install: ${{ inputs.post-install }}
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      if: ${{ runner.os == 'Windows' }}
      with:
        node-version: 20
        registry-url: 'https://npm.pkg.github.com'
    - name: 'Install dependencies (Windows)'
      if: ${{ runner.os == 'Windows' }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        npm ci --ignore-scripts --foreground-scripts --allow-git=root
      shell: pwsh
    - name: 'Setup certificates on macOS'
      id: setup-certificates-macos
      if: ${{ runner.os == 'macOS' }}
      uses: holepunchto/actions/setup-certificates/macos@v1
      with:
        certificate_base64: ${{ inputs.macos_certificate_base64 }}
        p12_password: ${{ inputs.macos_p12_password }}
        notarization_method: ${{ inputs.macos_notarization_method }}
        apple_id: ${{ inputs.macos_apple_id }}
        apple_password: ${{ inputs.macos_apple_password }}
        apple_team_id: ${{ inputs.macos_apple_team_id }}
        api_key_base64: ${{ inputs.macos_api_key_base64 }}
        api_key_id: ${{ inputs.macos_api_key_id }}
        api_issuer: ${{ inputs.macos_api_issuer }}
    - name: 'Setup certificates on Windows'
      id: setup-certificates-windows
      if: ${{ runner.os == 'Windows' }}
      uses: holepunchto/actions/setup-certificates/windows@v1
      with:
        signing_method: ${{ inputs.windows_signing_method }}
        cert_pfx_base64: ${{ inputs.windows_cert_pfx_base64 }}
        cert_password: ${{ inputs.windows_cert_password }}
    - name: 'Set up Snapcraft'
      if: ${{ runner.os == 'Linux' && inputs.linux_snap != '' }}
      uses: holepunchto/actions/setup-snapcraft@v1
    - name: 'Build application (Linux)'
      if: ${{ runner.os == 'Linux' }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        CHANNEL: '${{ inputs.channel }}'
        UPGRADE_KEY: "${{ inputs.upgrade_key != '' && inputs.upgrade_key || null }}"
        NODE_ENV: production
        HOST: ${{ inputs.host }}
        LINUX_SNAP: ${{ inputs.linux_snap != '' }}
      run: |
        sfw=$(command -v sfw || true)
        if [[ "$LINUX_SNAP" == "true" ]]; then
          # Snapcraft's managed LXD build cannot reach SFW's localhost proxy.
          npm run make
        else
          $sfw npm run make
        fi
      shell: bash
    - name: 'Build application (macOS)'
      if: ${{ runner.os == 'macOS' }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        CHANNEL: '${{ inputs.channel }}'
        UPGRADE_KEY: "${{ inputs.upgrade_key != '' && inputs.upgrade_key || null }}"
        MAC_CODESIGN_IDENTITY: '${{ inputs.macos_codesign_identity }}'
        KEYCHAIN_PROFILE: ${{ steps.setup-certificates-macos.outputs.keychain-profile }}
        NODE_ENV: production
        HOST: ${{ inputs.host }}
      run: |
        sfw=$(command -v sfw || true)
        $sfw npm run make
      shell: bash
    - name: 'Build application (Windows)'
      if: ${{ runner.os == 'Windows' }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        CHANNEL: '${{ inputs.channel }}'
        UPGRADE_KEY: "${{ inputs.upgrade_key != '' && inputs.upgrade_key || null }}"
        WINDOWS_CERT_SHA1: "${{ inputs.windows_signing_method == 'cert_pfx' && steps.setup-certificates-windows.outputs.certificate-thumbprint || inputs.windows_cert_sha1 }}"
        WINDOWS_SIGN_HOOK: ${{ github.action_path }}/windows-sign.js
        NODE_ENV: production
        HOST: ${{ inputs.host }}
        DEBUG: 'electron-*'
      run: |
        # sfw=$(command -v sfw || true)
        # # $sfw npm.cmd run make
        # npm.cmd run make
        npm run make
      shell: pwsh
    - name: 'Upload standalone executable artifact'
      if: ${{ inputs.standalone != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.standalone_artifact_name || inputs.standalone }}
        path: out/make/**/${{ inputs.standalone }}
        if-no-files-found: error
    - name: 'Upload Linux AppImage artifact'
      if: ${{ runner.os == 'Linux' && inputs.linux_appimage != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.linux_appimage_artifact_name || inputs.linux_appimage }}
        path: out/make/**/${{ inputs.linux_appimage }}
        if-no-files-found: error
    - name: 'Upload Linux Snap artifact'
      if: ${{ runner.os == 'Linux' && inputs.linux_snap != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.linux_snap_artifact_name || inputs.linux_snap }}
        path: out/make/**/${{ inputs.linux_snap }}
        if-no-files-found: error
    - name: 'Upload Linux Flatpak artifact'
      if: ${{ runner.os == 'Linux' && inputs.linux_flatpak != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.linux_flatpak_artifact_name || inputs.linux_flatpak }}
        path: out/make/**/${{ inputs.linux_flatpak }}
        if-no-files-found: error
    - name: 'Upload macOS DMG artifact'
      if: ${{ runner.os == 'macOS' && inputs.macos_dmg != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.macos_dmg_artifact_name || inputs.macos_dmg }}
        path: out/make/**/${{ inputs.macos_dmg }}
        if-no-files-found: error
    - name: 'Create macOS app bundle artifact'
      if: ${{ runner.os == 'macOS' && inputs.macos_app != '' }}
      env:
        MACOS_APP: ${{ inputs.macos_app }}
      run: |
        ditto -c -k --sequesterRsrc --keepParent \
          out/*-darwin-*/*.app \
          "$RUNNER_TEMP/$MACOS_APP"
      shell: bash
    - name: 'Upload macOS app bundle artifact'
      if: ${{ runner.os == 'macOS' && inputs.macos_app != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.macos_app }}
        path: ${{ runner.temp }}/${{ inputs.macos_app }}
        if-no-files-found: error
    - name: 'Upload Windows MSIX artifact'
      if: ${{ runner.os == 'Windows' && inputs.windows_msix != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.windows_msix_artifact_name || inputs.windows_msix }}
        path: out/make/**/${{ inputs.windows_msix }}
        if-no-files-found: error
    - name: 'Upload Windows ZIP artifact'
      if: ${{ runner.os == 'Windows' && inputs.windows_zip != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.windows_zip_artifact_name || inputs.windows_zip }}
        path: out/make/**/${{ inputs.windows_zip }}
        if-no-files-found: error
