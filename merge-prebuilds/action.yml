name: Merge prebuilds
description: Merge and upload native prebuilds

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/download-artifact@v1
      with:
        path: prebuilds
        merge-multiple: true
    - uses: holepunchto/actions/upload-artifact@v1
      with:
        name: prebuilds
        path: prebuilds
