name: Node.js base extended
description: Configure a Node.js project with a selectable Node.js version, npm ci support and compatibility with our custom Windows runners

# TODO: Merge with node-base.

inputs:
  allow-git:
    description: Allow git dependencies
    default: none
  clean-install:
    description: Use npm ci
    default: false
  force-install:
    description: Force install npm packages
    default: false
  version:
    description: Node.js version
    default: lts/*
  registry-url:
    description: npm registry URL to configure for auth
    default: https://registry.npmjs.org
  scope:
    description: Optional scope for scoped registries (e.g. @myorg)
  node-auth-token:
    description: npm auth token

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/setup-socket@v1
    - uses: holepunchto/actions/setup-node@v1
      with:
        version: ${{ inputs.version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
    - uses: holepunchto/actions/install-npm-dependencies@v1
      with:
        allow-git: ${{ inputs.allow-git }}
        clean-install: ${{ inputs.clean-install }}
        force-install: ${{ inputs.force-install }}
        node-auth-token: ${{ inputs.node-auth-token }}
