name: Node.js base
description: Configure a Node.js project

inputs:
  allow-git:
    description: Allow git dependencies
    default: none
  clean-install:
    description: Use npm ci
    default: false
  force-install:
    description: Force install npm packages
    default: false
  version:
    description: Node.js version
    default: lts/*
  registry-url:
    description: npm registry URL to configure for auth
    default: https://registry.npmjs.org
  scope:
    description: Optional scope for scoped registries (e.g. @myorg)
  node-auth-token:
    description: npm auth token

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/checkout@v1
    - uses: holepunchto/actions/setup-socket@v1
    - uses: RaisinTen/actions/setup-node@use-node-base-in-make-pear-app
      with:
        version: ${{ inputs.version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
    # setup-socket skips Socket Firewall on runners it has no binary for, so sfw
    # is not always on PATH; install directly when it is absent.
    - run: |
        sfw=$(command -v sfw || true)
        npm_cmd="npm"
        # Cannot use npm on Windows as it produces this error:
        # npm.ps1 cannot be loaded because running scripts is disabled on this system. For more information, see about_Execution_Policies at https:/go.microsoft.com/fwlink/?LinkID=135170.
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          npm_cmd="npm.cmd"
        fi
        $npm_cmd ${{ case(inputs.clean-install == 'true', 'ci', 'install') }} --ignore-scripts --foreground-scripts --allow-git=${{ case(inputs.allow-git == 'root', 'root', inputs.allow-git == 'all', 'all', 'none') }} ${{ case(inputs.force-install == 'true', '--force', '') }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN }}
      shell: bash
