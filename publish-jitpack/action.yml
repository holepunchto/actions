name: Publish JitPack package
description: Create the GitHub release of a JitPack package, or publish its draft release once gradle.properties declares the checksums of its assets, and build the release on JitPack

inputs:
  assets:
    description: The assets of the draft release whose checksums gradle.properties must declare, as names or globs separated by spaces
    required: false

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/create-github-release@v1
      if: ${{ !inputs.assets }}
    - run: |
        set -f

        for asset in $ASSETS; do
          gh release download $TAG --pattern "$asset" --dir $RUNNER_TEMP/assets
        done
      if: ${{ inputs.assets }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        ASSETS: ${{ inputs.assets }}
      shell: bash
    - run: |
        for asset in $RUNNER_TEMP/assets/*; do
          if ! grep -qF "$(sha256sum $asset | cut -d ' ' -f 1)" gradle.properties; then
            echo "::error::gradle.properties does not declare the checksum of $(basename $asset)"
            exit 1
          fi
        done
      if: ${{ inputs.assets }}
      shell: bash
    - run: gh release edit $TAG --draft=false
      if: ${{ inputs.assets }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      shell: bash
    - run: curl -fsS --max-time 1200 --retry 10 --retry-delay 30 --retry-all-errors -o /dev/null https://jitpack.io/com/github/$REPOSITORY/$TAG/${REPOSITORY#*/}-$TAG.pom
      env:
        REPOSITORY: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      shell: bash
