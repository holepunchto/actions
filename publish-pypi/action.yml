name: Publish to PyPI
description: Create a GitHub release and publish to PyPI

inputs:
  index:
    description: Index to publish to, either pypi or testpypi
    default: pypi
  build:
    description: The distributions to build before publishing those in dist/, either all, sdist, or none
    default: all

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/install-pip-dependencies@v1
      if: ${{ inputs.build != 'none' }}
      with:
        packages: build==1.5.0
    - run: python -m build ${{ case(inputs.build == 'sdist', '--sdist', '') }}
      if: ${{ inputs.build != 'none' }}
      shell: bash
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: ${{ case(inputs.index == 'testpypi', 'https://test.pypi.org/legacy/', 'https://upload.pypi.org/legacy/') }}
    - run: gh release create $REF_NAME dist/*
      env:
        GH_TOKEN: ${{ github.token }}
        REF_NAME: ${{ github.ref_name }}
      shell: bash
