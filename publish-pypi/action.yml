name: Publish to PyPI
description: Create a GitHub release and publish to PyPI

inputs:
  index:
    description: Index to publish to, either pypi or testpypi
    default: pypi
  build:
    description: The distributions to build before publishing those in dist/, either all, sdist, or none
    default: all

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/install-pip-dependencies@v1
      with:
        packages: ${{ format('twine==7.0.0 pypi-attestations==0.0.30 {0}', case(inputs.build != 'none', 'build==1.5.0', '')) }}
    - run: python -m build ${{ case(inputs.build == 'sdist', '--sdist', '') }}
      if: ${{ inputs.build != 'none' }}
      shell: bash
    - run: twine check --strict dist/*
      shell: bash
    - run: python -m pypi_attestations sign dist/*
      shell: bash
    - run: twine upload --non-interactive --attestations --repository $INDEX dist/*
      env:
        INDEX: ${{ inputs.index }}
      shell: bash
    - uses: holepunchto/actions/create-github-release@v1
      with:
        files: dist/*
