name: Publish Swift package
description: Create the GitHub release of a Swift package, or publish its draft release once Package.swift declares the checksums of its binary targets

inputs:
  assets:
    description: The assets of the draft release whose checksums Package.swift must declare, separated by spaces
    required: false

runs:
  using: composite
  steps:
    - uses: holepunchto/actions/create-github-release@v1
      if: ${{ !inputs.assets }}
    - run: for asset in $ASSETS; do gh release download $TAG --pattern $asset --dir $RUNNER_TEMP; done
      if: ${{ inputs.assets }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        ASSETS: ${{ inputs.assets }}
      shell: bash
    - run: for asset in $ASSETS; do grep -qF "$(sha256sum $RUNNER_TEMP/$asset | cut -d ' ' -f 1)" Package.swift; done
      if: ${{ inputs.assets }}
      env:
        ASSETS: ${{ inputs.assets }}
      shell: bash
    - run: gh release edit $TAG --draft=false
      if: ${{ inputs.assets }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      shell: bash
