name: Publish
description: Create a GitHub release and publish to npm

inputs:
  tag:
    description: npm dist-tag to publish under
    default: latest
  workspaces:
    description: Publish all workspace packages
    default: false
  include-workspace-root:
    description: Also publish the workspace root
    default: false
  node-auth-token:
    description: npm auth token

runs:
  using: composite
  steps:
    - run: node ${{ github.action_path }}/index.js
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN }}
        TAG: ${{ inputs.tag }}
        WORKSPACES: ${{ inputs.workspaces }}
        INCLUDE_WORKSPACE_ROOT: ${{ inputs.include-workspace-root }}
    - uses: holepunchto/actions/create-release@v1
      with:
        workspaces: ${{ inputs.workspaces }}
        include-workspace-root: ${{ inputs.include-workspace-root }}
