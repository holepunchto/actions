name: Setup Flutter
description: Install and configure a Flutter SDK

inputs:
  version:
    description: The Flutter SDK to install, or none for the latest
    required: false
  channel:
    description: The channel of the Flutter SDK to install
    default: stable

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.version }}
        channel: ${{ inputs.channel }}
