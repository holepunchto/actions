name: Setup GTK
description: Install GTK and, optionally, WebKitGTK

inputs:
  dev:
    description: Install the development packages for building against the libraries
    default: false
  webkit:
    description: Also install WebKitGTK, and allow the sandbox it runs web content in
    default: false

runs:
  using: composite
  steps:
    - run: |
        if [ "$DEV" = "true" ]; then
          packages="libgtk-4-dev"
          if [ "$WEBKIT" = "true" ]; then packages="$packages libwebkitgtk-6.0-dev"; fi
        else
          packages="libgtk-4-1"
          if [ "$WEBKIT" = "true" ]; then packages="$packages libwebkitgtk-6.0-4"; fi
        fi

        sudo apt-get update -y
        sudo apt-get install -y $packages
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      env:
        DEV: ${{ inputs.dev }}
        WEBKIT: ${{ inputs.webkit }}
    - run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
      if: ${{ runner.os == 'Linux' && inputs.webkit == 'true' }}
      shell: bash
