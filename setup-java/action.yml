name: Setup Java
description: Install and configure a Java JDK

inputs:
  version:
    description: Java version to install
    default: '21'
  cache:
    description: Dependency manager whose downloads to cache (gradle, maven or sbt)

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.version }}
        cache: ${{ inputs.cache }}
