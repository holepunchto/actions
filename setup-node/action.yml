name: Setup Node.js
description: Install and configure Node.js

inputs:
  version:
    description: The Node.js version to install, such as 24 or lts/*
    default: lts/*
  registry-url:
    description: The npm registry URL to configure authentication for
    default: https://registry.npmjs.org
  scope:
    description: The package scope to use the registry for, such as @myorg
  package-manager-cache:
    description: Cache the package manager's global directory
    default: false
  check-latest:
    description: Resolve the version against the latest Node.js releases instead of the runner tool cache
    default: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        package-manager-cache: ${{ inputs.package-manager-cache }}
        check-latest: ${{ inputs.check-latest }}
