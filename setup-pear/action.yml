name: Setup Pear
description: Install Pear

runs:
  using: composite
  steps:
    - name: 'Install Pear (Linux/macOS)'
      if: ${{ runner.os != 'Windows' }}
      run: curl https://install.pears.com/pear.sh | sh
      shell: bash
    - name: 'Install Pear (Windows)'
      if: ${{ runner.os == 'Windows' }}
      run: irm https://install.pears.com/pear.ps1 | iex
      shell: pwsh
