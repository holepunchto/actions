name: Setup Python
description: Install and configure Python

inputs:
  python-version:
    description: Python version to install
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
