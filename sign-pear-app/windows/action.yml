name: 'Sign Pear App on Windows'
description: 'Sign the files of an artifact built by make-pear-app, without running app code'

inputs:
  artifact:
    description: 'Artifact whose files are signed and re-uploaded under the same name'
    required: true
  signing_method:
    description: 'cert_sha1 (certificate already installed) or cert_pfx'
    required: false
    default: 'cert_sha1'
  cert_sha1:
    description: 'SHA1 thumbprint of the installed certificate (cert_sha1)'
    required: false
    default: ''
  cert_pfx_base64:
    description: 'Base64-encoded pfx certificate (cert_pfx)'
    required: false
    default: ''
  cert_password:
    description: 'Password for the pfx certificate (cert_pfx)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/sign-pear-app/artifact
    - name: 'Setup certificates'
      id: certificates
      uses: holepunchto/actions/setup-certificates/windows@8c9558555af5a408885fe1891dae250de1d7dcbe
      with:
        signing_method: ${{ inputs.signing_method }}
        cert_pfx_base64: ${{ inputs.cert_pfx_base64 }}
        cert_password: ${{ inputs.cert_password }}
    - name: 'Sign files'
      env:
        DIR: ${{ runner.temp }}/sign-pear-app/artifact
        CERT_SHA1: ${{ inputs.signing_method == 'cert_pfx' && steps.certificates.outputs.certificate-thumbprint || inputs.cert_sha1 }}
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
        if (!$signtool) { throw 'signtool.exe not found' }
        foreach ($file in Get-ChildItem -Recurse -File $env:DIR) {
          & $signtool.FullName sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /sha1 $env:CERT_SHA1 $file.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      shell: powershell
    - name: 'Upload signed files'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/sign-pear-app/artifact
        if-no-files-found: error
        overwrite: true
